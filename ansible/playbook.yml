- hosts: web
  become: true

  vars:
    app_path: /home/ubuntu/docmost-wiki
    backup_path: /home/ubuntu/backup
    branch_name: main

  tasks:

    - name: Install required base packages
      apt:
        name:
          - git
          - curl
          - snapd
          - ca-certificates
        state: present
        update_cache: yes

    - name: Install Docker using official script
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
      args:
        executable: /bin/bash

    - name: Wait for SSH to come back
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Install Docker Compose plugin
      apt:
        name: docker-compose-plugin
        state: present

    - name: Install AWS CLI via snap
      snap:
        name: aws-cli
        classic: yes

    - name: Clone repository
      git:
        repo: "https://github.com/Aspokange/docmost-wiki.git"
        dest: "{{ app_path }}"
        version: "{{ branch_name }}"
        force: yes
        update: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # Create file .env for docker-compose

    - name: Create .env file
      copy:
        dest: "{{ app_path }}/.env"
        owner: ubuntu
        mode: '0600'
        content: |
          DOCMOST_APP_PORT={{ docmost_app_port }}
          DOCMOST_DB_USER={{ docmost_db_user }}
          DOCMOST_DB_PASSWORD={{ docmost_db_password }}
          DOCMOST_DB_NAME={{ docmost_db_name }}
          REDIS_URL=redis://redis:6379
          DATABASE_URL=postgres://{{ docmost_db_user }}:{{ docmost_db_password }}@db:5432/{{ docmost_db_name }}

    - name: Create backup directory
      file:
        path: "{{ backup_path }}"
        state: directory
        owner: ubuntu
        mode: '0755'

    - name: Create backup script
      copy:
        dest: "{{ backup_path }}/backup.sh"
        mode: '0755'
        owner: ubuntu
        content: |
          #!/bin/bash
          set -e
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          FILE="docmost_${DATE}.sql"
          docker exec docmost-db pg_dump -U {{ docmost_db_user }} {{ docmost_db_name }} > /tmp/$FILE
          aws s3 cp /tmp/$FILE {{ s3_bucket }}
          rm /tmp/$FILE

    - name: Configure cron backup
      cron:
        name: "Docmost Backup"
        minute: "0"
        hour: "2"
        user: ubuntu
        job: "{{ backup_path }}/backup.sh >> /home/ubuntu/backup.log 2>&1"

    # Deployment CI

    - name: Build containers
      become: false
      shell: |
        chdir: "{{ app_path }}/app"
        docker compose build
      args:
        executable: /bin/bash

    - name: Start containers
      become: false
      shell: |
        chdir: "{{ app_path }}/app"
        docker compose up -d
      args:
        executable: /bin/bash