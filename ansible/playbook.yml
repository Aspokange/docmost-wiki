- hosts: web
  become: true

  vars:
    app_path: /home/ubuntu/docmost-wiki
    backup_path: /home/ubuntu/backup
    branch_name: main
    monitoring_path: /home/ubuntu/docmost-wiki/monitoring

  tasks:

    # ============================================================
    # SYSTEM BASE SETUP
    # ============================================================

    - name: Install required base packages
      apt:
        name:
          - git
          - curl
          - snapd
          - ca-certificates
        state: present
        update_cache: yes

    - name: Install Docker using official script
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
      args:
        executable: /bin/bash

    - name: Wait for SSH to come back
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Install Docker Compose plugin
      apt:
        name: docker-compose-plugin
        state: present

    - name: Install AWS CLI via snap
      snap:
        name: aws-cli
        classic: yes

    # ============================================================
    # APPLICATION DEPLOYMENT
    # ============================================================

    - name: Clone repository
      git:
        repo: "https://github.com/Aspokange/docmost-wiki.git"
        dest: "{{ app_path }}"
        version: "{{ branch_name }}"
        force: yes
        update: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create .env file
      copy:
        dest: "{{ app_path }}/app/.env"
        owner: ubuntu
        mode: '0600'
        content: |
          DOCMOST_APP_PORT={{ docmost_app_port }}
          DOCMOST_DB_USER={{ docmost_db_user }}
          DOCMOST_DB_PASSWORD={{ docmost_db_password }}
          DOCMOST_DB_NAME={{ docmost_db_name }}
          REDIS_URL=redis://redis:6379
          DATABASE_URL=postgres://{{ docmost_db_user }}:{{ docmost_db_password }}@db:5432/{{ docmost_db_name }}
          APP_SECRET={{ docmost_app_secret }}

    # ============================================================
    # BACKUP CONFIGURATION
    # ============================================================

    - name: Create backup directory
      file:
        path: "{{ backup_path }}"
        state: directory
        owner: ubuntu
        mode: '0755'

    - name: Create backup script
      copy:
        dest: "{{ backup_path }}/backup.sh"
        mode: '0755'
        owner: ubuntu
        content: |
          #!/bin/bash
          set -e
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          FILE="docmost_${DATE}.sql"
          docker exec docmost-db pg_dump -U {{ docmost_db_user }} {{ docmost_db_name }} > /tmp/$FILE
          aws s3 cp /tmp/$FILE {{ s3_bucket }}
          rm /tmp/$FILE

    - name: Configure cron backup
      cron:
        name: "Docmost Backup"
        minute: "0"
        hour: "19"
        user: ubuntu
        job: "{{ backup_path }}/backup.sh >> /home/ubuntu/backup.log 2>&1"

    # ============================================================
    # MONITORING STACK (Prometheus / Alertmanager / Grafana)
    # ============================================================

    - name: Set blackbox target for DEV
      set_fact:
        blackbox_target: "http://{{ ansible_host }}:{{ docmost_app_port }}"
      when: branch_name == "dev"

    - name: Set blackbox target for PROD
      set_fact:
        blackbox_target: "http://{{ ansible_host }}:{{ docmost_app_port }}"
      when: branch_name == "main"

    - name: Ensure Prometheus directory exists
      file:
        path: "{{ monitoring_path }}/prometheus"
        state: directory
        owner: ubuntu
        mode: '0755'

    - name: Deploy prometheus config
      template:
        src: templates/prometheus.yml.j2
        dest: "{{ monitoring_path }}/prometheus/prometheus.yml"
        owner: ubuntu
        mode: '0644'

    - name: Ensure alert rules directory exists
      file:
        path: "{{ monitoring_path }}/prometheus"
        state: directory
        owner: ubuntu
        mode: '0755'

    - name: Deploy alert rules
      copy:
        src: files/alert.rules.yml
        dest: "{{ monitoring_path }}/prometheus/alert.rules.yml"
        owner: ubuntu
        mode: '0644'

    - name: Create monitoring .env file
      copy:
        dest: "{{ monitoring_path }}/.env"
        owner: ubuntu
        mode: '0600'
        content: |
          SMTP_SMARTHOST={{ smtp_smarthost }}
          SMTP_FROM={{ smtp_from }}
          SMTP_USERNAME={{ smtp_username }}
          SMTP_PASSWORD={{ smtp_password }}

    - name: Build monitoring containers
      command: docker compose build
      args:
        chdir: "{{ monitoring_path }}"

    - name: Start monitoring containers
      command: docker compose up -d
      args:
        chdir: "{{ monitoring_path }}"

    # ============================================================
    # APPLICATION CONTAINERS START
    # ============================================================

    - name: Build containers
      command: docker compose build
      args:
        chdir: "{{ app_path }}/app"

    - name: Start containers
      command: docker compose up -d
      args:
        chdir: "{{ app_path }}/app"



    - name: Show running containers
      command: docker ps
      register: docker_output

    - name: Show running containers
      debug:
        var: docker_output.stdout
