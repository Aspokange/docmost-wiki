name: Terraform Infrastructure

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "infra/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::682135518833:role/Docmost-GitHub-Role' || 'arn:aws:iam::682135518833:role/Docmost-GitHub-Dev-Role' }}
          aws-region: eu-west-3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------- DEV ---------------
      - name: Terraform Init Dev
        if: github.ref == 'refs/heads/dev'
        run: terraform -chdir=infra/dev init

      - name: Terraform Plan Dev
        if: github.ref == 'refs/heads/dev'
        run: terraform -chdir=infra/dev plan

      - name: Terraform Apply Dev
        if: github.ref == 'refs/heads/dev'
        run: terraform -chdir=infra/dev apply -auto-approve

      - name: Wait for SSH (Dev)
        if: github.ref == 'refs/heads/dev'
        run: sleep 60

      - name: Deploy to Dev via SSH
        if: github.ref == 'refs/heads/dev'
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DOCMOST_DB_USER: ${{ secrets.DOCMOST_DB_USER }}
          DOCMOST_DB_PASSWORD: ${{ secrets.DOCMOST_DB_PASSWORD }}
          DOCMOST_DB_NAME: ${{ secrets.DOCMOST_DB_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DOCMOST_APP_PORT: ${{ secrets.DOCMOST_APP_PORT }}
        run: |
          echo "${{ secrets.EC2_SSH_KEY_PROD }}" > key.pem
          chmod 600 key.pem

          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$(terraform -chdir=infra/prod output -raw public_ip) << EOF
            set -e
            cd docmost-wiki/app || exit 1

            printf "APP_SECRET=%s\nDOCMOST_DB_USER=%s\nDOCMOST_DB_PASSWORD=%s\nDOCMOST_DB_NAME=%s\nDATABASE_URL=%s\nNEXTAUTH_URL=%s\nAPP_URL=%s\nREDIS_URL=%s\nDOCMOST_APP_PORT=%s\n" \
            "$APP_SECRET" \
            "$DOCMOST_DB_USER" \
            "$DOCMOST_DB_PASSWORD" \
            "$DOCMOST_DB_NAME" \
            "$DATABASE_URL" \
            "$NEXTAUTH_URL" \
            "$APP_URL" \
            "$REDIS_URL" \
            "$DOCMOST_APP_PORT" > .env

            docker compose up -d --build
          EOF

      # ---------------- Prod ---------------
      - name: Terraform Init Prod
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=infra/prod init

      - name: Terraform Plan Prod
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=infra/prod plan

      - name: Terraform Apply Prod
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=infra/prod apply -auto-approve

      - name: Wait for SSH (Prod)
        if: github.ref == 'refs/heads/main'
        run: sleep 60

      - name: Deploy to Prod via SSH
        if: github.ref == 'refs/heads/main'
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DOCMOST_DB_USER: ${{ secrets.DOCMOST_DB_USER }}
          DOCMOST_DB_PASSWORD: ${{ secrets.DOCMOST_DB_PASSWORD }}
          DOCMOST_DB_NAME: ${{ secrets.DOCMOST_DB_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DOCMOST_APP_PORT: ${{ secrets.DOCMOST_APP_PORT }}
        run: |
          echo "${{ secrets.EC2_SSH_KEY_DEV }}" > key.pem
          chmod 600 key.pem

          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$(terraform -chdir=infra/dev output -raw public_ip) << EOF
            set -e
            cd docmost-wiki/app || exit 1

            printf "APP_SECRET=%s\nDOCMOST_DB_USER=%s\nDOCMOST_DB_PASSWORD=%s\nDOCMOST_DB_NAME=%s\nDATABASE_URL=%s\nNEXTAUTH_URL=%s\nAPP_URL=%s\nREDIS_URL=%s\nDOCMOST_APP_PORT=%s\n" \
            "$APP_SECRET" \
            "$DOCMOST_DB_USER" \
            "$DOCMOST_DB_PASSWORD" \
            "$DOCMOST_DB_NAME" \
            "$DATABASE_URL" \
            "$NEXTAUTH_URL" \
            "$APP_URL" \
            "$REDIS_URL" \
            "$DOCMOST_APP_PORT" > .env

            docker compose up -d --build
          EOF